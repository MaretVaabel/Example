<!DOCTYPE html>
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-pood</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Minu E-pood</h1>

      <!-- Toote valik -->
      <div class="products">
        <div class="product" id="product1">
          <h2>Arvuti</h2>
          <p>Hind: 1000€</p>
          <button onclick="addToCart('Arvuti', 1000, 1)">Lisa ostukorvi</button>
        </div>
        <div class="product" id="product2">
          <h2>Telefon</h2>
          <p>Hind: 600€</p>
          <button onclick="addToCart('Telefon', 600, 1)">Lisa ostukorvi</button>
        </div>
        <div class="product" id="product3">
          <h2>Kõrvaklapid</h2>
          <p>Hind: 100€</p>
          <button type="button" onclick="addToCart('Kõrvaklapid', 100, 1)">
            Lisa ostukorvi
          </button>
        </div>
      </div>

      <!-- Ostukorv -->
      <div class="cart">
        <h2>Ostukorv</h2>
        <ul id="cartItems"></ul>
        <p>Kogusumma: <span id="totalPrice">0</span>€</p>
        <button onclick="emptyCart();">Tühjenda ostukorv</button>
      </div>
    </div>

    <script src="./index.js" type="module"></script>
  </body>
</html>
